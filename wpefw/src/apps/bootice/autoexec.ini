// BootICE — deploy and create shortcuts
EXEC =!cmd /c "if not exist \"%ProgramFiles%\BootICE\" mkdir \"%ProgramFiles%\BootICE\""
EXEC =!cmd /c "copy /y \"%CurDir%\BOOTICE.exe\" \"%ProgramFiles%\BootICE%\""
LINK *%Desktop%\BootICE,%ProgramFiles%\BootICE\BOOTICE.exe
LINK *%Programs%\BootICE,%ProgramFiles%\BootICE\BOOTICE.exe
